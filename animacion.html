<!DOCTYPE html>
<html lang="es">
    

<head>
<meta charset="UTF-8" />
<title>Fábrica de coches</title>
<style>
    body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    }
    .factory {
    width: 500px;
    height: 250px;
    background: #ddd;
    border-radius: 12px;
    position: relative;
    margin-bottom: 20px;
    overflow: hidden;
    }
    .car {
    position: absolute;
    bottom: 40px;
    left: 0px;
    width: 260px;
    height: 80px;
    background: #3498db;
    border-radius: 20px;
    transition: all 0.8s ease;
    }
    .wheel {
    width: 40px;
    height: 40px;
    background: #222;
    border-radius: 50%;
    position: absolute;
    bottom: -20px;
    opacity: 0;
    transition: opacity 0.5s ease;
    }
    .wheel.front { left: 30px; }
    .wheel.back { right: 30px; }

    .window {
    width: 60px;
    height: 30px;
    background: #aee6ff;
    position: absolute;
    top: 10px;
    left: 100px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.5s ease;
    }

    .spoiler {
    width: 50px;
    height: 10px;
    background: #555;
    position: absolute;
    top: -10px;
    right: 10px;
    opacity: 0;
    transition: opacity 0.5s ease;
    }

    button {
    margin: 5px;
    padding: 10px 15px;
    font-size: 14px;
    cursor: pointer;
    }
</style>
</head>
<body>
<h1>🚗 Fabricados Lopez</h1>

<div class="factory">
    <div class="car" id="car">
    <div class="wheel front" id="wheel1"></div>
    <div class="wheel back" id="wheel2"></div>
    <div class="window" id="window"></div>
    <div class="spoiler" id="spoiler"></div>
    </div>
</div>

<div>
    <button onclick="addWheels()">Añadir ruedas</button>
    <button onclick="addWindow()">Añadir ventanas</button>
    <button onclick="addSpoiler()">Añadir alerón</button>
    <button onclick="resetCar()">Reiniciar</button>
</div>

<script>
    let position = 0;

    function moveCar() {
    position += 60;
    document.getElementById('car').style.left = position + 'px';
    }

    function addWheels() {
    document.getElementById('wheel1').style.opacity = 1;
    document.getElementById('wheel2').style.opacity = 1;
    moveCar();
    }

    function addWindow() {
    document.getElementById('window').style.opacity = 1;
    moveCar();
    }

    function addSpoiler() {
    document.getElementById('spoiler').style.opacity = 1;
    moveCar();
    }

    function resetCar() {
    position = 0;
    document.getElementById('car').style.left = '0px';
    document.getElementById('wheel1').style.opacity = 0;
    document.getElementById('wheel2').style.opacity = 0;
    document.getElementById('window').style.opacity = 0;
    document.getElementById('spoiler').style.opacity = 0;
    }
</script>
</body>
</html>
