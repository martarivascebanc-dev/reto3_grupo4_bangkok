<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fábrica - Ensamblaje de Coche</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .fabrica {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 450px;
            margin: 50px auto;
            background-color: #f0f0f0;
            border: 3px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .titulo {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        /* Cinta transportadora */
        .cinta {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #666;
            border-top: 3px solid #444;
            border-bottom: 3px solid #444;
        }

        /* Líneas de la cinta */
        .cinta-lineas {
            position: absolute;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 40px,
                #888 40px,
                #888 60px
            );
            animation: moverCinta 3s linear infinite;
        }

        @keyframes moverCinta {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Contenedor del coche */
        .coche {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Carrocería - aparece primero */
        .carroceria {
            width: 120px;
            height: 40px;
            background-color: #e74c3c;
            border-radius: 10px 10px 5px 5px;
            position: relative;
            opacity: 0;
            animation: aparecer 1s ease-in forwards;
            animation-delay: 1s;
        }

        /* Techo - aparece segundo */
        .techo {
            width: 60px;
            height: 25px;
            background-color: #c0392b;
            border-radius: 8px 8px 0 0;
            position: absolute;
            top: -20px;
            left: 25px;
            opacity: 0;
            transform: translateY(-30px);
            animation: caerPieza 1s ease-in forwards;
            animation-delay: 2.5s;
        }

        /* Ventanas - aparecen con el techo */
        .ventana {
            width: 20px;
            height: 15px;
            background-color: #5DADE2;
            position: absolute;
            top: -15px;
            opacity: 0;
            animation: aparecer 0.5s ease-in forwards;
            animation-delay: 3s;
        }

        .ventana-izq {
            left: 28px;
            border-radius: 3px 0 0 0;
        }

        .ventana-der {
            right: 38px;
            border-radius: 0 3px 0 0;
        }

        /* Ruedas - aparecen al final */
        .rueda {
            width: 25px;
            height: 25px;
            background-color: #2c3e50;
            border-radius: 50%;
            position: absolute;
            bottom: -8px;
            border: 3px solid #555;
            opacity: 0;
            transform: scale(0);
            animation: aparecerRueda 0.8s ease-out forwards;
        }

        .rueda-izq {
            left: 15px;
            animation-delay: 4s;
        }

        .rueda-der {
            right: 15px;
            animation-delay: 4.3s;
        }

        /* Animaciones */
        @keyframes aparecer {
            0% { 
                opacity: 0;
                transform: scale(0.5);
            }
            100% { 
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes caerPieza {
            0% { 
                opacity: 0;
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(5px);
            }
            100% { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes aparecerRueda {
            0% { 
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            70% {
                transform: scale(1.1) rotate(180deg);
            }
            100% { 
                opacity: 1;
                transform: scale(1) rotate(360deg);
            }
        }

        /* Brazos robóticos que colocan las piezas generado con IA */
        .brazo {
            position: absolute;
            width: 15px;
            height: 80px;
            background-color: #f39c12;
            border-radius: 5px;
            top: 20px;
            opacity: 0;
        }

        .brazo1 {
            left: 48%;
            animation: moverBrazo 1.5s ease-in-out;
            animation-delay: 2s;
        }

        .brazo2 {
            left: 46%;
            animation: moverBrazo 1.5s ease-in-out;
            animation-delay: 3.5s;
        }

        @keyframes moverBrazo {
            0%, 100% { 
                opacity: 0;
                transform: translateY(-50px);
            }
            20%, 80% { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Soporte de la cinta */
        .soporte {
            position: absolute;
            width: 20px;
            height: 100px;
            background-color: #555;
            bottom: 0;
        }

        .soporte1 { left: 10%; }
        .soporte2 { left: 30%; }
        .soporte3 { left: 50%; }
        .soporte4 { left: 70%; }
        .soporte5 { left: 90%; }

        /* Pared de la fábrica */
        .pared {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #95a5a6;
            border-bottom: 3px solid #7f8c8d;
        }

        /* Indicador de proceso generado con IA */
        .proceso {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            opacity: 0;
        }

        .paso1 { animation: mostrarPaso 1.5s ease-in-out; animation-delay: 1s; }
        .paso2 { animation: mostrarPaso 1.5s ease-in-out; animation-delay: 2.5s; }
        .paso3 { animation: mostrarPaso 1.5s ease-in-out; animation-delay: 4s; }

        @keyframes mostrarPaso {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1 class="titulo">🏭 Línea de Ensamblaje - Montaje Automático</h1>
    
    <div class="fabrica">
        <div class="pared"></div>

        <!-- Indicadores de proceso -->
        <div class="proceso paso1">1. Instalando carrocería...</div>
        <div class="proceso paso2">2. Colocando techo...</div>
        <div class="proceso paso3">3. Montando ruedas...</div>

        <!-- Brazos robóticos -->
        <div class="brazo brazo1"></div>
        <div class="brazo brazo2"></div>
        
        <!-- Cinta transportadora -->
        <div class="cinta">
            <div class="cinta-lineas"></div>
        </div>

        <!-- Soportes de la cinta -->
        <div class="soporte soporte1"></div>
        <div class="soporte soporte2"></div>
        <div class="soporte soporte3"></div>
        <div class="soporte soporte4"></div>
        <div class="soporte soporte5"></div>

        <!-- Coche que se va ensamblando -->
        <div class="coche">
            <div class="techo">
                <div class="ventana ventana-izq"></div>
                <div class="ventana ventana-der"></div>
            </div>
            <div class="carroceria">
                <div class="rueda rueda-izq"></div>
                <div class="rueda rueda-der"></div>
            </div>
        </div>
    </div>

</body>
</html>
